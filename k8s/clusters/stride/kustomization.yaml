apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stride

# Pull in the shared base manifests
resources:
  - ../../base

# ── Docker Hub image tags ──────────────────────────────────────────────────────
# Update newTag to the image tag you pushed to Docker Hub
images:
  - name: stride-api
    newName: bhopathivardhan1/stride-api
    newTag: latest
  - name: stride-web
    newName: bhopathivardhan1/stride-web
    newTag: latest

# ── Cluster-specific overrides ────────────────────────────────────────────────
patches:
  # Real domain + URLs
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: stride-config
        namespace: stride
      data:
        APP_URL:               https://stride.inferix.in
        FRONTEND_URL:          https://stride.inferix.in
        NEXT_PUBLIC_API_URL:   https://api.stride.inferix.in
        NEXT_PUBLIC_APP_URL:   https://stride.inferix.in
        EMAIL_LAMBDA_URL:      https://tqbpgz7ze42kzgzaheo76q6ika0sgqhl.lambda-url.us-east-1.on.aws/
        CONTACT_EMAIL:         reharse@inferix.in
        STRIPE_PRICE_PRO:      price_xxx
        STRIPE_PRICE_BUSINESS: price_xxx
        TYPESENSE_HOST:        kmhc0p7r4ef8bugap-1.a1.typesense.net
        API_URL:               https://api.stride.inferix.in

  # Fix Let's Encrypt email in ClusterIssuer
  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          email:  reharse@inferix.in

  # t3.medium single node: 1 replica, tighter resources
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api-hpa
        namespace: stride
      spec:
        minReplicas: 1
        maxReplicas: 2

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web-hpa
        namespace: stride
      spec:
        minReplicas: 1
        maxReplicas: 2

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: stride
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 384Mi

  # Real domains for ingress
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: stride-web-ingress
        namespace: stride
      spec:
        tls:
          - hosts:
              - stride.inferix.in
            secretName: stride-web-tls
        rules:
          - host: stride.inferix.in
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: web-svc
                      port:
                        number: 3000

  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: stride-api-ingress
        namespace: stride
      spec:
        tls:
          - hosts:
              - api.stride.inferix.in
            secretName: stride-api-tls
        rules:
          - host: api.stride.inferix.in
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: api-svc
                      port:
                        number: 4000

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        namespace: stride
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: web
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 384Mi
