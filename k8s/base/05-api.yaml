apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: stride
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Wait for Postgres to be reachable before running prisma migrate deploy
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo "waiting for postgres..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-svc 6379; do echo "waiting for redis..."; sleep 2; done']

      containers:
        - name: api
          image: stride-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            # ── Non-secret config ───────────────────────────────────────────────
            - name: NODE_ENV
              value: production
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: PORT
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: APP_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: FRONTEND_URL
            - name: EMAIL_LAMBDA_URL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: EMAIL_LAMBDA_URL
            - name: CONTACT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: CONTACT_EMAIL
            - name: STRIPE_PRICE_PRO
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: STRIPE_PRICE_PRO
            - name: STRIPE_PRICE_BUSINESS
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: STRIPE_PRICE_BUSINESS

            # ── DATABASE_URL (built from secret + configmap) ────────────────────
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://stride:$(POSTGRES_PASSWORD)@postgres-svc:5432/stride

            # ── Secrets ─────────────────────────────────────────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: JWT_REFRESH_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: ANTHROPIC_API_KEY
            - name: EMAIL_LAMBDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: EMAIL_LAMBDA_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: STRIPE_WEBHOOK_SECRET

            # ── Redis (BullMQ) ───────────────────────────────────────────────
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: REDIS_PASSWORD

            # ── Typesense (cloud search) ─────────────────────────────────────
            - name: TYPESENSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: TYPESENSE_HOST
            - name: TYPESENSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: TYPESENSE_PORT
            - name: TYPESENSE_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: TYPESENSE_PROTOCOL
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: TYPESENSE_API_KEY

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: stride
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: stride
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
