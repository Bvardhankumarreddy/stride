apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stride
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: stride-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Internal API URL for server-side rendering (Next.js → K8s service)
            - name: API_URL
              value: http://api-svc:4000
            # These are baked at build time via Docker build args.
            # They must match the values used when building the image.
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: stride-config
                  key: APP_URL
            # DB access needed by NextAuth for session/token storage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://stride:$(POSTGRES_PASSWORD)@postgres-svc:5432/stride
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stride-secrets
                  key: GITHUB_CLIENT_SECRET

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /pricing
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /pricing
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: stride
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: stride
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
