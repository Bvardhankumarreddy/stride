name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all images'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  # ── Detect which services changed ─────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || inputs.force_build == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || inputs.force_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'app/**'

  # ── Build & push changed images ───────────────────────────────────────────
  build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: bhopathivardhan1/stride-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v5
        with:
          context: app/
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: bhopathivardhan1/stride-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.stride.inferix.in
            NEXT_PUBLIC_APP_URL=https://stride.inferix.in
            AUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            AUTH_URL=https://stride.inferix.in
            DATABASE_URL=placeholder
            API_URL=http://localhost:4000

  # ── Deploy to EC2 ─────────────────────────────────────────────────────────
  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest k8s manifests and apply (configmaps, secrets refs, etc.)
            cd /home/ubuntu/stride && git pull origin main
            kubectl apply -k k8s/clusters/stride/

            CHANGED=""
            if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
              CHANGED="$CHANGED deployment/api"
            fi
            if [ "${{ needs.changes.outputs.web }}" = "true" ]; then
              CHANGED="$CHANGED deployment/web"
            fi

            if [ -n "$CHANGED" ]; then
              kubectl rollout restart $CHANGED -n stride

              for DEPLOYMENT in $CHANGED; do
                echo "Waiting for $DEPLOYMENT..."
                if ! kubectl rollout status $DEPLOYMENT -n stride --timeout=240s; then
                  echo "❌ $DEPLOYMENT rollout failed — rolling back"
                  kubectl rollout undo $DEPLOYMENT -n stride
                  kubectl rollout status $DEPLOYMENT -n stride --timeout=60s
                  exit 1
                fi
                echo "✅ $DEPLOYMENT is healthy"
              done
            else
              echo "No image changes — configmap/manifests applied only"
            fi
